name: CI

# Waliduje i kompiluje firmware na kazdym PR i pushu; na tagu v* publikuje
# Release z binarkami. Workflow NIE potrzebuje zadnych sekretow - konfiguracja
# testowa (test/ci-config.yaml) zawiera wylacznie wartosci fikcyjne.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Wersja ESPHome zsynchronizowana z Device Builderem (2026.9+ dla LibreTiny).
  # Kompilujemy na wersji, ktora realnie siedzi w ESPHome Device Builderze uzytkownika
  # (2026.10.x). Wczesniejszy pin 2026.9.1 dal zielone "esphome config" i czerwony
  # "esphome compile", bo to_code() wykonuje sie dopiero przy generowaniu kodu.
  ESPHOME_VERSION: "2026.10.0"
  PYTHON_VERSION: "3.13"
  GITLEAKS_VERSION: "8.30.1"
  # sha256 archiwum release - pobierane binarium jest weryfikowane przed uzyciem
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # ---- Bramka wersji: VERSION == makra komponentow == nazwa tagu ----
  # Rozjazd (tag wskazywal v1.3.3, SOFT_I2C_VERSION w kodzie mial "1.2.7") kosztowal nas runde
  # debugowania na sprzecie: linia "soft_i2c v1.2.7 ..." z logu urzadzenia nie dawala sie
  # przypisac do commita ani do Release. "Prosze pamietac" nie dziala - dziala czerwony job.
  version-consistency:
    name: Spojnosc wersji (VERSION == makra == tag)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Porownaj VERSION z makrami komponentow i nazwa tagu
        run: bash scripts/check_version.sh

  # ---- Bramka wejscia: zadnych sekretow w drzewie ani w calej historii ----
  secret-scan:
    name: Skan sekretow (drzewo + historia)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Pobrz repoztior z cala historia
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pobierz i zweryfikuj gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # Kontrola negatywna: bramka sekretow jest bezwartosciowa, jesli skaner
      # nic nie detektuje. Zasynam syntetyczny (nie-dzialajacy) token GitHub PAT
      # w osobnym repo tymczasowym i wymagam, zeby gitleaks go znalazl.
      # Powod: w gitleaks >=8 podanie pliku konfiguracyjnego ZASTEPUJE reguly
      # domyslne - plik z samym allowlistem wylacza detekcje calkowicie.
      - name: Kontrola negatywna skanera
        run: |
          set -euo pipefail
          probe=$(mktemp -d)
          git init -q "$probe"
          git -C "$probe" config user.email ci@localhost
          git -C "$probe" config user.name 'CI probe'
          printf 'GH_TOKEN=ghp_%s\n' "$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 36)" > "$probe/probe.env"
          git -C "$probe" add -A
          git -C "$probe" commit -qm 'syntetyczny probe - to nie jest sekret'
          if gitleaks detect --source "$probe" --exit-code 1 >/dev/null 2>&1; then
            echo "::error::Kontrola negatywna nie udana: gitleaks nie wykryl zasadzonego tokena."
            echo "Bramka sekretow bylaby pozorna - zatrzymam build."
            rm -rf "$probe"
            exit 1
          fi
          rm -rf "$probe"
          echo "Kontrola negatywna OK - skaner detektuje sekrety."

      # Skan na regulach DOMYSLNYCH, bez --config i bez .gitleaks.toml w repo.
      - name: Skanuj drzewo robocze
        run: gitleaks detect --source . --exit-code 1

      - name: Skanuj cala historie commitow
        run: gitleaks git . --exit-code 1

      # Reguly domyslne gitleaks NIE znaja formatu fine-grained PAT (`github_pat_...`)
      # - potwierdzone kontrola negatywna. Sprawdzam te formaty osobno, po calym diffie
      # historii, wiec lapie tez sekret usuniety w pozniejszym commicie.
      - name: Skan uzupelniajacy (fine-grained PAT, formaty poza regulami)
        run: |
          set -euo pipefail
          if git log --all -p -U0 | grep -aE 'github_pat_[A-Za-z0-9]{40,}|gh[surop]_[A-Za-z0-9]{36,}'; then
            echo "::error::Wykryto token GitHub w formacie poza regulami gitleaks."
            exit 1
          fi
          echo "Skan uzupelniajany czysty."

  # ---- Audyt samego workflow: least privilege, brak injection ----
  workflow-audit:
    name: Audyt workflow (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: zizmor (skanner bezpieczenstwa GitHub Actions)
        run: |
          set -euo pipefail
          python -m pip install --upgrade "zizmor==1.31.1"
          zizmor --format plain .github

      # actionlint i zizmor nie wiedza, ktore joby MUSZA istniec - a nadgryziony job oznaczalby
      # cichy brak kontroli (albo odrzucenie workflowa przez GitHuba, jak przy utracie secret-scan).
      - name: Kontrola struktury workflow (oczekiwane joby, needs, kroki)
        run: |
          set -euo pipefail
          python -m pip install "pyyaml==6.0.3"
          python scripts/check_workflow.py

  # ---- Walidacja YAML na wersji pinowanej i najnowszej ----
  validate:
    name: Walidacja YAML (ESPHome ${{ matrix.esphome_version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pin na wersji Buildera + latest, by lapac przejscia API z wyprzedzeniem
        # (np. bus_id -> i2c_id, przebudowa schematow encji).
        esphome_version: ["2026.9.1", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Zainstaluj ESPHome
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ "${{ matrix.esphome_version }}" = "latest" ]; then
            python -m pip install esphome
          else
            python -m pip install "esphome==${{ matrix.esphome_version }}"
          fi
          esphome --version

      # example.yaml opisuje pobraanie przez git; CI testuje kod z tego commita.
      - name: Wymus lokalne zrodlo komponentu w example.yaml
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re
          p = pathlib.Path("example.yaml")
          t = p.read_text(encoding="utf-8")
          t = re.sub(r"type: git", "type: local", t)
          t = re.sub(r"\s+url: \S+", "", t)
          t = re.sub(r"\s+ref: \S+", "", t)
          t = t.replace("type: local", "type: local\n      path: ./components", 1)
          p.write_text(t, encoding="utf-8")
          PY
          grep -A3 external_components example.yaml

      # example.yaml uzywa !secret - generujemy fikcyjne secrets.yaml, zeby
      # walidacja przechodzila bez zadnych prawdziwych wartosci w repozitorium.
      - name: Wygeneruj fikcyjne secrets.yaml
        run: |
          set -euo pipefail
          # Heredoc MUSI byc niecytowany (<<EOF), inaczej '$(...)' trafia do pliku jako
          # doslowny tekst, a esphome wywala "Invalid key format, base64".
          API_KEY="$(python -c 'import base64; print(base64.b64encode(b"ci-placeholder-key-32-bytes-0123").decode())')"
          cat > secrets.yaml <<EOF
          wifi_ssid: CI-NETWORK
          wifi_password: CI-NETWORK-PASSWORD
          wifi_fallback_password: CI-FALLBACK
          ota_password: ci-only-not-a-secret
          api_key: ${API_KEY}
          EOF
          # Test doslownym por6wnaniem, nie regexem: klucz base64 konczy sie znakiem
          # '=', wiec sprawdzenie typu 'grep -c "[A-Za-z0-9+/]\{44\}"' nie pasaje
          # do zadnego poprawnego klucza i falszywie wywala build.
          grep -qxF "api_key: ${API_KEY}" secrets.yaml || { echo "::error::secrets.yaml nie zawiera wygenerowanego klucza"; exit 1; }
          # Bez PyYAML: w tym kroku nie mozemy zakladac, ze zaleznosci sa juz zainstalowane.
          python - <<'PYCHK'
          import base64, sys
          linia = next(l for l in open("secrets.yaml", encoding="utf-8") if l.startswith("api_key:"))
          klucz = base64.b64decode(linia.split(":", 1)[1].strip(), validate=True)
          assert len(klucz) == 32, f"api_key dekoduje sie do {len(klucz)} bajt6w, oczekiwane 32"
          print("secrets.yaml OK: api_key to 32-bajtowy klucz base64")
          PYCHK
          grep -qxF "wifi_ssid: CI-NETWORK" secrets.yaml || { echo "::error::wifi_ssid nie jest fikcyjny"; exit 1; }

      - name: esphome config example.yaml
        run: |
          set -euo pipefail
          # Zrodlo komponentu jest juz przekierowane na drzewo przez krok "Wymus lokalne zrodlo
          # komponentu w example.yaml", wiec ten krok nie dotiera do GitHuba i nie zalezy od
          # tego, czy dany tag istnieje na remote.
          esphome config example.yaml

      - name: esphome config test/ci-config.yaml
        run: esphome config test/ci-config.yaml

  # ---- Pelna kompilacja firmware (CBU / BK7231N + LibreTiny) ----
  compile:
    name: Kompilacja firmware (CBU / BK7231N)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [secret-scan, validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Zainstaluj ESPHome ${{ env.ESPHOME_VERSION }}
        run: python -m pip install "esphome==${{ env.ESPHOME_VERSION }}"

      # Swiadomie bez actions/cache: cache zapisywany przy pull_request z forka to
      # powierzchnia ataku (cache poisoning). Koszt: ~60 s dluzsza kompilacja.
      - name: Kompilacja
        run: esphome compile test/ci-config.yaml

      - name: Zbierz artefakty
        run: |
          set -euo pipefail
          mkdir -p dist
          # ESPHome tworzy .esphome/ obok pliku YAML (tutaj: test/.esphome/...), nie w
          # korzeniu repo. Szukamy bezposrednio plikow, a nie katalogu - mniej zalozen
          # o uklad. -print -quit zamiast '| head -n 1': przy 'set -o pipefail' glowa
          # zamyka pipe i find konczy sie SIGPIPE (rc=141), co walilo caly krok.
          firm="$(find . -type f -name firmware.bin -path '*/.pioenvs/*' -print -quit)"
          # sed -n '1,20p' zamiast 'head -20': sed konsumuje calle wyjscie, wiec find nie
          # dostaje SIGPIPE (rc=141) przy 'set -o pipefail' i komunikat bledu nie znika.
          test -n "$firm" || { echo "::error::brak firmware.bin pod .pioenvs - build nie dal binarki?"; find . -maxdepth 6 -type f -name '*.bin' | sed -n '1,20p'; exit 1; }
          bin="$(dirname "$firm")"
          # find zamiast 'ls | head': actionlint odpala shellcheck (SC2012) i info-level
          # uwaga wywala krok; '| head' to dodatkowo SIGPIPE przy 'set -o pipefail'.
          test -f "$bin/image_bk7231n_app.ota.rbl" || { echo "::error::brak $bin/image_bk7231n_app.ota.rbl"; find "$bin" -maxdepth 1 -type f -printf '%s  %p\n'; exit 1; }
          cp "$firm" dist/soft-i2c-firmware.bin
          cp "$bin/image_bk7231n_app.ota.rbl" dist/soft-i2c-firmware.ota.rbl
          (cd dist && sha256sum soft-i2c-firmware.bin soft-i2c-firmware.ota.rbl > SHA256SUMS.txt)
          find dist -maxdepth 1 -type f -printf '%s  %p\n' | sort -k2
          cat dist/SHA256SUMS.txt

      - name: Upload artefaktow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-cbu
          path: dist/
          if-no-files-found: error

  # ---- Kompilacja na starszym ESPHome: to_code() nie jest objete "esphome config" ----
  # Zielone "esphome config" na 2026.9.1 nic nie mowilo o sterowniku: to_code() wykonuje sie
  # dopiero przy generowaniu kodu, a wiec dopiero w "esphome compile". Dokladnie tak przeoczylismy
  # sensor.sub_sensors() - API ktore pojavilo sie w 2026.10 i nie istnieje w 2026.9.1 (run
  # 40419236663: "AttributeError: module 'esphome.components.sensor' has no attribute
  # 'sub_sensors'"). Ten job buduje ta sama konfiguracja na 2026.9.1, bez artefaktow: pilnuje,
  # zeby sciezka kompatybilnosci w components/cht83xx/sensor.py byla sprawdzana przez CI, a nie
  # przez pamiecia autora.
  compile-legacy:
    name: Kompilacja ESPHome 2026.9.1 (kompatybilnosc API)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [secret-scan, validate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Zainstaluj ESPHome 2026.9.1
        run: python -m pip install "esphome==2026.9.1"

      - name: Kompilacja
        run: esphome compile test/ci-config.yaml

  # ---- CD: Release na tagu v* (git tag v1.1.0 && git push --tags) ----
  release:
    name: Opublikuj Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compile, compile-legacy, workflow-audit, version-consistency]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Pobierz artefakty firmware
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-cbu
          path: dist

      - name: Utworz Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="Firmware zbudowany przez CI (ESPHome ${ESPHOME_VERSION}, board CBU / BK7231N).

          - \`soft-i2c-firmware.bin\` - pelny obraz do flasha przez UART (od 0x0)
          - \`soft-i2c-firmware.ota.rbl\` - obraz OTA dla Beken
          - \`SHA256SUMS.txt\` - sumy kontrolne

          Ten build celowo NIE wlacza API: jezeli urzadzenie ma mowic z Home
          Assistantem, klucz API musi byc Twoj - zbuduj firmware wlasna
          konfiguracja przez ESPHome Device Builder (README, sekcja 'Device
          Builder'). Binarki stad sluza do sprawdzenia, ze komponent sie kompiluje."
          # 'gh' rozwiazuje repo przez 'git' - bez kroku checkout nie ma .git i kazdy
          # krok gh pada z 'fatal: not a git repository'. Jawne --repo usuwa to zalozenie,
          # nie dorzucajac zbednego checkoutu (release potrzebuje tylko artefaktow).
          REPO_FLAG=(--repo "$GITHUB_REPOSITORY")
          if gh release view "$TAG" "${REPO_FLAG[@]}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${REPO_FLAG[@]}" --clobber \
              dist/soft-i2c-firmware.bin dist/soft-i2c-firmware.ota.rbl dist/SHA256SUMS.txt
          else
            gh release create "$TAG" "${REPO_FLAG[@]}" --title "soft_i2c $TAG" --notes "$notes" --latest \
              dist/soft-i2c-firmware.bin dist/soft-i2c-firmware.ota.rbl dist/SHA256SUMS.txt
          fi
          gh release view "$TAG" "${REPO_FLAG[@]}"
