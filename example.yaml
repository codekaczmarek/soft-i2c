# Sekrety w secrets.yaml (obok tego pliku): wifi_ssid, wifi_password,
# wifi_fallback_password, ota_password, api_key (base64, 32 B).
# Test project for the soft_i2c external component (BK7231 / CBU + SHT3xD)
substitutions:
  devicename: th-cbu-01            # nazwa urzadzenia w sieci / mDNS
  upper_devicename: "T&H CBU #01"

esphome:
  name: ${devicename}
  friendly_name: ${upper_devicename}

bk72xx:
  board: cbu

external_components:
  - source:
      type: git
      url: https://github.com/codekaczmarek/soft-i2c.git
      ref: v1.3.4

preferences:
  flash_write_interval: 1min

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${devicename} Fallback Hotspot"
    password: !secret wifi_fallback_password

captive_portal:

web_server:
  port: 80

# Pulls the I2C base classes into the build. There is no hardware I2C driver on BK7231,
# so the list stays empty and soft_i2c below provides the bus.
i2c: []

# Sensor pins of the factory Tuya T&H board (CBU / BK7231N): SDA=P22, SCL=P20, address 0x40.
# These two pads are shared with JTAG (TDI/TCK) and the flash lines (FSI/FSCK), which is why the
# Beken SDK filters writes to GPIO20..23 - soft_i2c removes that filter in setup() and reports
# what it found. TX1/RX1 (P11/P10) do NOT work for bit-bang: they are UART1, and the UART block
# owns the pad. Log output lives on UART2 (P0/P1), so this choice costs you nothing there.
soft_i2c:
  - id: bus_i2c
    sda: P22
    scl: P20
    frequency: 100kHz
    scan: true
    internal_pullup: true

sensor:
  # Sensylink CHT8305/CHT8310. NOT sht3xd: that driver speaks Sensirion (command words with
  # CRC-8) and tries to disable a heater this chip does not have, so it fails in setup().
  - platform: cht83xx
    temperature:
      name: "${upper_devicename} Temperature"
    humidity:
      name: "${upper_devicename} Humidity"
    address: 0x40
    i2c_id: bus_i2c
    update_interval: 5min

binary_sensor:
  - platform: status
    name: "${devicename} - Status"
