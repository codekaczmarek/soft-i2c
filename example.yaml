# Test project for the soft_i2c external component (BK7231 / CBU + SHT3xD)
substitutions:
  devicename: th-cbu-01            # nazwa urzadzenia w sieci / mDNS
  upper_devicename: "T&H CBU #01"

esphome:
  name: ${devicename}
  friendly_name: ${upper_devicename}

bk72xx:
  board: cbu

external_components:
  - source:
      type: git
      url: https://github.com/TWOJ_LOGIN/soft-i2c
      ref: main

preferences:
  flash_write_interval: 1min

logger:

api:
  encryption:
    key: "${api_key}"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${devicename} Fallback Hotspot"
    password: !secret wifi_fallback_password

captive_portal:

web_server:
  port: 80

# Pulls the I2C base classes into the build. There is no hardware I2C driver on BK7231,
# so the list stays empty and soft_i2c below provides the bus.
i2c: []

# Your module has the sensor on TX1/RX1 (P11/P10) = UART1. Bit-bang does not care about the
# alternate functions, so these pins work here — with one caveat: UART1 is also the flashing
# port. Log output stays on the default UART2 (P0/P1), so nothing else conflicts; just do the
# first flash over UART1 with the bus attached (idle-high is fine for both) or use OTA later.
soft_i2c:
  - id: bus_sht
    sda: TX1
    scl: RX1
    frequency: 100kHz
    scan: true
    internal_pullup: true

sensor:
  - platform: sht3xd
    temperature:
      name: "${upper_devicename} Temperature"
    humidity:
      name: "${upper_devicename} Humidity"
    address: 0x44
    i2c_id: bus_sht
    update_interval: 5min

binary_sensor:
  - platform: status
    name: "${devicename} - Status"
